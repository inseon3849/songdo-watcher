name: Tennis Court Watcher

on:
  schedule:
    # 5분마다 실행, 단 정각(0,5,10...)이 아니라 2분 오프셋(2,7,12...)으로
    # 실행시켜서 GitHub 전체가 몰리는 정각 타이밍을 살짝 피함
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    # Actions 탭에서 수동으로도 실행해볼 수 있게 해줌

permissions:
  contents: write  # last_checked.txt 파일을 저장소에 다시 커밋하기 위해 필요

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 코트 확인 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ONCE: "1"
        run: python watcher_v2.py

      - name: 마지막 확인 시각 기록 (GitHub의 60일 비활성 자동중지를 방지)
        run: date -u +"%Y-%m-%d %H:%M:%S UTC" > last_checked.txt

      - name: 변경 사항 커밋
        run: |
          git config user.name "tennis-watcher-bot"
          git config user.email "actions@github.com"
          git add last_checked.txt
          git diff --cached --quiet || git commit -m "update check log"
          git push