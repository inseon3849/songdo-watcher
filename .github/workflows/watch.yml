name: Tennis Court Watcher

on:
  # GitHub 자체 예약(schedule)은 몇 시간씩 밀려서 사용하지 않음.
  # 대신 cron-job.org가 10분마다(한국 01:00~04:59 제외) 이 워크플로를 실행시킴.
  # Actions 탭에서 수동 실행(Run workflow)도 가능.
  workflow_dispatch:

permissions:
  contents: read  # 코드만 읽으면 됨 (커밋 안 함)

# 이전 실행이 아직 돌고 있으면 새 실행은 끝날 때까지 대기 (동시에 두 개가 돌지 않게)
concurrency:
  group: tennis-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 코트 확인 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ONCE: "1"
        run: python watcher_v2.py
